# configs/strategies.yaml
# Definicion de estrategias, costos y metricas para backtesting
# Fiel a notebooks/05 (etapa 1: indicadores aislados) y 06 (etapa 2: E2-A / BH / E2-C).
# Todo LONG-ONLY (0/1): allow_short=false.

# Etapa 1 — indicadores aislados (best params TPE Exp01, docs/experimento_01_resumen.md)
individuals:
  rsi:
    enabled: true
    params: {period: 27, oversold: 41, overbought: 86, exit_level: 50}
    signal_rule: "RSI cruza arriba OS -> LONG; RSI >= 50 -> FLAT"
  macd:
    enabled: true
    params: {fast: 30, slow: 46, signal: 25}
    signal_rule: "MACD cruza arriba Signal -> LONG; cruza abajo -> FLAT"
  sma:
    enabled: true
    params: {fast: 7, slow: 228, kind: sma}
    signal_rule: "SMA_fast > SMA_slow -> LONG else FLAT"
  ema:
    enabled: true
    params: {fast: 2, slow: 190, kind: ema}
    signal_rule: "EMA_fast > EMA_slow -> LONG else FLAT"
  cci:
    enabled: true
    params: {period: 39, entry: -64, exit: 143}
    signal_rule: "CCI cruza arriba entry -> LONG; CCI > exit -> FLAT"

# Etapa 2 — comparacion de 3 sistemas completos
strategies:
  buy_and_hold:
    enabled: true
    params: {}
    signal_rule: "Siempre LONG (benchmark: hold BTC con el capital)"

  e2a_composite:
    enabled: true
    params: # A1 paper (reproduccion); A2 optimizado en comentario
      cci_period: 20
      cci_entry: -100
      cci_exit: 100
      sma_fast: 20
      sma_slow: 50
      vol_window: 20
      vol_z_thr: 0.5
    # A2 TPE 150 (docs/experimento_02_plan.md): {cci_period: 58, cci_entry: -3, cci_exit: 186, sma_fast: 18, sma_slow: 221, vol_window: 40, vol_z_thr: 0.58}
    signal_rule: "SMA tendencia + CCI momento + Volumen confirmacion"

  e2c_winners:
    enabled: true
    params:
      sma_fast: 20
      sma_slow: 150
      rsi_period: 14
      rsi_ob: 70
      macd_fast: 12
      macd_slow: 26
      macd_sig: 9
    signal_rule: "SMA regimen + MACD trigger + RSI filtro (top ganadoras etapa 1)"

  # E2-A PSO congelado: parametros ganadores del PSO de la v2 (semilla 42),
  # guardados en docs/tesis_resultados_v2/tablas/pso_best.json. Se congelan para
  # que la v3 sea reproducible y no re-optimice en cada corrida. OJO: el PSO se
  # optimizo con rf=0; la v3 solo cambia el REPORTE (rf=4%), no los parametros.
  e2a_pso_frozen:
    enabled: true
    params:
      cci_period: 10
      cci_entry: 50.0
      cci_exit: 250.0
      sma_fast: 27
      sma_slow: 227
      vol_window: 60
      vol_z_thr: 0.1431
    signal_rule: "E2-A con parametros PSO v2 (objetivo rf=0, historico)"

  # PSO re-optimizado con el objetivo correcto (Sharpe IS70 con rf=4%).
  # Resultado: mejora marginal en IS70 (1.546 vs 1.523) pero colapsa OOS30
  # (-0.174) y C24 (-0.204). Se conserva como evidencia de sobreajuste; NO se
  # usa en el bot. Ver docs/tesis_resultados_v3/tablas/pso_v3.json.
  e2a_pso_rf4:
    enabled: true
    params:
      cci_period: 10
      cci_entry: 16.4058
      cci_exit: 250.0
      sma_fast: 27
      sma_slow: 250
      vol_window: 13
      vol_z_thr: 0.8839
    signal_rule: "E2-A re-optimizado con rf=4% (sobreajuste documentado)"

# ---------------------------------------------------------------------------
# Seleccion canonica v3 (TPE, 100 trials, mediana Sharpe OOS con rf=4%,
# folds 2021-2024, warmup global). Es la unica fuente de parametros de la v3.
# Resultado: E2-A vuelve a A2 (el TPE no mejora la seleccion anterior).
# ---------------------------------------------------------------------------
v3_selection:
  protocol: "TPE 100 trials | mediana Sharpe OOS folds 2021-2024 | rf=4% | warmup global | 5 trades/fold"
  params:
    rsi:  {period: 20, oversold: 45, overbought: 80}
    macd: {fast: 26, slow: 89, signal: 20}
    sma:  {fast: 19, slow: 247}
    ema:  {fast: 77, slow: 115}
    cci:  {period: 36, entry: -75, exit_: 150}
    e2a:  {cci_period: 58, cci_entry: -3, cci_exit: 186, sma_fast: 18, sma_slow: 221, vol_window: 40, vol_z_thr: 0.5815632644010449}

backtest:
  initial_capital: 10000.0
  timeframe: "4h"              # temporalidad canonica de TODO el analisis
  risk_free_annual: 0.04       # T-Bill 3M EE.UU.; ver docs/ANEXO_METODOLOGICO.md
  fees:
    maker: 0.001   # 0.10% spot Binance sin BNB
    taker: 0.001
    use_taker: true
  slippage:
    bps: 5        # 0.05% por lado, configurable por volumen
    model: "fixed_bps"  # fixed_bps | atr_based
  position:
    type: "fixed_fraction"  # fixed_fraction | volatility_targeting
    fraction: 1.0
    max_leverage: 1.0
    allow_short: false   # LONG-ONLY (0/1), fiel a notebooks/05-06
  execution:
    lag: 1        # ejecuta en t+1 para evitar look-ahead bias (close_t -> open_{t+1})

metrics:
  - pnl
  - equity_curve
  - cagr
  - sharpe
  - calmar
  - max_drawdown
  - max_drawdown_duration
  - win_rate
  - profit_factor
  - turnover
  - exposure
  - fees_total
  - slippage_total

optimization:
  method: "optuna"  # optuna | grid | genetic | pso (TPE mediana OOS Sharpe; NSGA-II Pareto)
  objective: "sharpe"  # sharpe | calmar | profit_factor
  n_trials: 80
  cv: "walk_forward"
