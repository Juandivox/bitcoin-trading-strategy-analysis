# configs/data.yaml
# Configuracion central para ingestion y features de BTCUSDT

binance:
  base_url: "https://data.binance.vision"
  symbol: "BTCUSDT"
  market: "spot"          # spot | futures (um)
  interval: "1m"          # 1s,1m,3m,5m,15m,30m,1h,2h,4h,6h,8h,12h,1d
  # Rango: desde el primer listado de BTCUSDT en Binance (2017-08-17) hasta hoy
  start_date: "2017-08-17"
  end_date: null          # null = hoy, o "2026-09-01"
  # Modos de descarga: monthly para historico, daily para completar ultimo mes
  download:
    concurrent_workers: 8
    retries: 5
    timeout_s: 60
    checksum_verify: true   # verifica SHA256 del .CHECKSUM oficial
    overwrite: false

  # Detalle microsegundos 2025-01-01
  timestamp:
    cutoff_microseconds: "2025-01-01"
    # Archivos >= 2025-01-01 vienen en microsegundos (e.g. 1735689600000000)
    # Archivos <  2025-01-01 vienen en milisegundos (e.g. 1735689600000)
    # El parser normaliza automaticamente a UTC milliseconds

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  features_dir: "data/features"
  # Estructura en raw: data/raw/spot/monthly/klines/BTCUSDT/1m/  y  data/raw/spot/daily/klines/...

dataset:
  # Columnas maestras objetivo (1m base)
  master_columns:
    - timestamp
    - open
    - high
    - low
    - close
    - volume          # volume_btc
    - quote_volume    # volume_usdt
    - trade_count
    - taker_buy_volume
    - taker_buy_quote_volume
    - taker_sell_volume
    - taker_sell_quote_volume
    - buy_ratio
    - sell_ratio
    - volume_delta
    - cvd             # cumulative volume delta
    - return_1m
    - return_5m
    - return_15m
    - return_60m
    - realized_volatility
    - volume_ma
    - volume_zscore
    - imbalance

  # Features adicionales calculados downstream
  features:
    price:
      returns: [1, 5, 15, 60, 240]
      log_returns: true
    volume:
      windows: [20, 60, 240]
      zscore_window: 60
    volatility:
      windows: [60, 240]
    technical:
      rsi_period: 14
      macd: { fast: 12, slow: 26, signal: 9 }
      atr_period: 14

# Estrategia de validacion temporal (NO random split)
validation:
  method: "walk_forward"   # walk_forward | expanding | fixed
  # Ejemplo academico defendible:
  folds:
    - { train: ["2018-01-01", "2020-12-31"], test: ["2021-01-01", "2021-12-31"] }
    - { train: ["2018-01-01", "2021-12-31"], test: ["2022-01-01", "2022-12-31"] }
    - { train: ["2018-01-01", "2022-12-31"], test: ["2023-01-01", "2023-12-31"] }
    - { train: ["2018-01-01", "2023-12-31"], test: ["2024-01-01", "2024-12-31"] }
  oos: ["2025-01-01", null]

duckdb:
  # Para consultas rapidas sobre parquet
  memory_limit: "4GB"
  threads: 4
